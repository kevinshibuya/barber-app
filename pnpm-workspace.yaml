packages:
  - apps/*
  - packages/*

# NativeWind's Babel preset (react-native-css-interop/babel.js) names this
# plugin without declaring it; EAS's install does not hoist it where Babel
# looks, so the release bundle fails without the declaration.
packageExtensions:
  react-native-css-interop:
    dependencies:
      '@babel/plugin-transform-react-jsx': ^7.29.7

allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.14'
  - babel-preset-expo@58.0.19
  - expo-router@58.0.25
  - expo@58.0.17
